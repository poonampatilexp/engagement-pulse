name: CI

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - master
      - develop

jobs:
  backend-fastapi-tests:
    name: Backend Unit & API Tests (FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: engagement_pulse_fastapi
          POSTGRES_USER: pulse_user
          POSTGRES_PASSWORD: pulse_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse_user -d engagement_pulse_fastapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend-fastapi/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-fastapi/requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://pulse_user:pulse_password@localhost:5432/engagement_pulse_fastapi
          REDIS_URL: redis://localhost:6379/0
          SEED_CONSULTANT_PASSWORD: ConsultantDevPass#2026
          SEED_CLIENT_VIEWER_PASSWORD: ViewerDevPass#2026
        run: |
          cd backend-fastapi
          alembic upgrade head

      - name: Seed database
        env:
          DATABASE_URL: postgresql+psycopg://pulse_user:pulse_password@localhost:5432/engagement_pulse_fastapi
          REDIS_URL: redis://localhost:6379/0
          SEED_CONSULTANT_PASSWORD: ConsultantDevPass#2026
          SEED_CLIENT_VIEWER_PASSWORD: ViewerDevPass#2026
        run: |
          cd backend-fastapi
          python seed.py

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg://pulse_user:pulse_password@localhost:5432/engagement_pulse_fastapi
          REDIS_URL: redis://localhost:6379/0
          SEED_CONSULTANT_PASSWORD: ConsultantDevPass#2026
          SEED_CLIENT_VIEWER_PASSWORD: ViewerDevPass#2026
        run: |
          cd backend-fastapi
          pytest tests/ -v

  frontend-tests:
    name: Frontend Jest Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run Jest test suite
        run: npm --prefix frontend test -- --watchAll=false --runInBand

      - name: Run Next.js production build check
        env:
          DJANGO_INTERNAL_URL: http://backend:8000
          INTERNAL_API_URL: http://backend:8000
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
        run: npm --prefix frontend run build

